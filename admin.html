<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalkX Yonetim Paneli</title>
  <style>
    :root {
      --bg: #090b14;
      --bg-2: #0d101c;
      --surface: #121624;
      --surface-2: #171c2d;
      --surface-3: #20263a;
      --border: #2a3044;
      --border-strong: #3a4260;
      --text: #f5f7ff;
      --muted: #9da6bd;
      --muted-2: #717b94;
      --accent: #7c63ff;
      --accent-2: #6550dc;
      --accent-soft: rgba(124, 99, 255, 0.14);
      --cyan: #20d8e7;
      --success: #45d89b;
      --danger: #ff667e;
      --warning: #ffc46d;
      --shadow: 0 20px 48px rgba(0, 0, 0, 0.32);
    }
    * { box-sizing:border-box; }
    body { font-family: Inter, Segoe UI, Tahoma, sans-serif; margin:0; padding:20px; min-height:100vh; background:radial-gradient(900px 520px at 88% -12%, rgba(124,99,255,.14), transparent 62%),radial-gradient(680px 420px at 20% 0%, rgba(32,216,231,.06), transparent 62%),linear-gradient(180deg,var(--bg-2),var(--bg)); color:var(--text); }
    body.admin-nav-open, body.admin-drawer-open { overflow:hidden; }
    button, input, select, textarea { font:inherit; }
    .container { max-width: 1500px; margin: 0 auto; }
    .header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .logo { width:34px; height:34px; border-radius:12px; object-fit:contain; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); }
    .cards { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); margin-bottom:16px; }
    .card { background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:var(--shadow); backdrop-filter: blur(2px); }
    .card .t { font-size:12px; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
    .card .v { font-size:28px; font-weight:700; }
    .card .s { font-size:12px; color:var(--success); margin-top:4px; }
    .panel { background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.012)); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:var(--shadow); backdrop-filter: blur(2px); }
    .tabs { border-bottom:2px solid var(--border); margin-bottom:12px; display:flex; flex-wrap:wrap; gap:2px; }
    .tab { border:none; border-radius:10px 10px 0 0; background:none; padding:10px 14px; color:var(--muted); font-weight:600; cursor:pointer; border-bottom:2px solid transparent; transition:background .14s ease,color .14s ease; }
    .tab:hover { background:rgba(255,255,255,0.04); color:var(--text); }
    .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
    input, select { border:1px solid var(--border); border-radius:10px; padding:8px 10px; background:rgba(21,28,40,0.74); color:var(--text); }
    input::placeholder, textarea::placeholder { color:var(--muted-2); }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(78,161,255,0.2); }
    table { width:100%; border-collapse:collapse; table-layout:fixed; }
    th, td { padding:10px; border-bottom:1px solid var(--border); text-align:left; vertical-align:middle; word-break:break-word; }
    th { background:rgba(255,255,255,0.035); color:var(--muted); }
    tbody tr:nth-child(even) { background:rgba(255,255,255,0.02); }
    tbody tr:hover { background:rgba(106,174,255,0.06); }
    .th-sort { border:none; background:transparent; padding:0; color:var(--muted); font:inherit; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .th-sort:hover { color:var(--text); }
    .th-sort.is-active { color:var(--accent); }
    .username-cell { display:inline-flex; align-items:center; gap:8px; }
    .platform-tag { display:inline-flex; align-items:center; gap:5px; padding:2px 8px 2px 4px; border-radius:999px; border:1px solid rgba(255,255,255,0.32); background:rgba(255,255,255,0.09); color:#f2f5fb; font-size:10px; font-weight:700; letter-spacing:.02em; line-height:1; }
    .platform-mini { display:inline-flex; width:20px; height:20px; align-items:center; justify-content:center; border-radius:999px; border:1px solid rgba(255,255,255,0.3); background:rgba(10,16,24,0.45); color:#f3f7ff; }
    .platform-mini svg { width:14px; height:14px; display:block; }
    .btn { border:none; border-radius:10px; padding:6px 10px; color:#fff; cursor:pointer; font-size:12px; margin-right:5px; }
    .btn:hover { filter:brightness(1.08); }
    .btn:disabled { opacity:.55; cursor:not-allowed; filter:none; }
    .btn-refresh, .btn-details { background:var(--accent-2); }
    .btn-notify { background:#6f56d9; }
    .btn-ban { background:#d94f4f; }
    .btn-perm { background:#b63c3c; }
    .btn-shadow { background:#4a5a75; }
    .btn-unban { background:#2fad6e; }
    .btn-delete { background:#cf4141; }
    .badge { display:inline-block; color:#fff; border-radius:999px; padding:3px 8px; font-size:11px; font-weight:700; }
    .badge.sent { background:#2cad6b; } .badge.failed { background:#d94f4f; } .badge.pending { background:#c88b2f; }
    .badge.temp, .badge.system { background:#c88b2f; } .badge.perm { background:#b63c3c; } .badge.shadow { background:#4a5a75; }
    .diag { border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,0.02); padding:10px; margin-bottom:12px; font-size:13px; color:var(--text); }
    .diag-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px 12px; }
    .modal { position:fixed; inset:0; background:rgba(7,11,18,.82); display:none; align-items:center; justify-content:center; padding:12px; z-index:9999; backdrop-filter: blur(2px); }
    .modal-box { width:min(900px,100%); max-height:90vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; }
    .modal-close { float:right; cursor:pointer; font-size:24px; line-height:1; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin-bottom:10px; }
    .item { border:1px solid var(--border); border-radius:10px; background:rgba(255,255,255,0.02); padding:10px; font-size:13px; min-width:0; }
    .item strong { display:block; margin-bottom:5px; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.045em; text-transform:uppercase; }
    .desc { border:1px solid var(--border); border-radius:10px; background:rgba(255,255,255,0.02); padding:10px; white-space:pre-wrap; }
    .media { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-top:10px; }
    .media .m { border:1px solid var(--border); border-radius:10px; padding:8px; background:rgba(255,255,255,0.02); }
    .media img, .media video { width:100%; max-height:220px; object-fit:contain; background:#0a0f18; border-radius:8px; }
    .legal-editor { display:flex; flex-direction:column; gap:16px; }
    .legal-hero { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:18px; border:1px solid var(--border); border-radius:16px; background:linear-gradient(135deg,rgba(124,99,255,.14),rgba(32,216,231,.05)); }
    .legal-hero h2 { margin:0 0 6px; font-size:20px; }
    .legal-hero p { margin:0; color:var(--muted); max-width:700px; font-size:13px; line-height:1.55; }
    .legal-live-pill { flex:0 0 auto; border:1px solid rgba(69,216,155,.35); color:var(--success); background:rgba(69,216,155,.08); border-radius:999px; padding:7px 10px; font-size:11px; font-weight:800; }
    .legal-cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    .legal-card { text-align:left; color:var(--text); border:1px solid var(--border); border-radius:14px; padding:14px; background:rgba(255,255,255,.025); cursor:pointer; min-width:0; }
    .legal-card:hover,.legal-card.is-active { border-color:var(--accent); background:var(--accent-soft); }
    .legal-card-head { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-bottom:10px; }
    .legal-card strong { font-size:13px; }
    .legal-card small { display:block; color:var(--muted); line-height:1.45; }
    .legal-state { border-radius:999px; padding:3px 7px; font-size:10px; color:var(--success); background:rgba(69,216,155,.1); white-space:nowrap; }
    .legal-state.is-dirty { color:var(--warning); background:rgba(255,196,109,.1); }
    .legal-workbench { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:14px; align-items:start; }
    .legal-editor-panel,.legal-side-panel { border:1px solid var(--border); border-radius:16px; background:rgba(255,255,255,.018); padding:16px; }
    .legal-panel-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
    .legal-panel-head h3 { margin:0 0 5px; }
    .legal-panel-head p { margin:0; color:var(--muted); font-size:12px; }
    .legal-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .legal-field { display:flex; flex-direction:column; gap:6px; }
    .legal-field label { font-size:12px; color:var(--muted); font-weight:600; }
    .legal-field input,.legal-field select,.legal-field textarea { width:100%; }
    .legal-field textarea { border:1px solid var(--border); border-radius:10px; padding:10px; resize:vertical; min-height:240px; font-family:inherit; font-size:13px; line-height:1.55; background:rgba(21,28,40,0.74); color:var(--text); }
    .legal-status { font-size:12px; color:var(--muted); }
    .legal-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .legal-publish-box { display:flex; flex-direction:column; gap:10px; }
    .legal-publish-box h4,.legal-history h4 { margin:0; font-size:13px; }
    .legal-check { display:flex; gap:8px; align-items:flex-start; color:var(--muted); font-size:11px; line-height:1.4; }
    .legal-check input { width:auto; margin-top:2px; }
    .legal-preview { border:1px solid var(--border); border-radius:12px; padding:11px; background:rgba(0,0,0,.16); font-size:12px; }
    .legal-preview strong { display:block; margin-bottom:6px; }
    .legal-diff-list { display:flex; flex-direction:column; gap:5px; margin-top:8px; color:var(--muted); }
    .legal-history { margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
    .legal-history-list { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
    .legal-history-item { border:1px solid var(--border); border-radius:10px; padding:9px; font-size:11px; color:var(--muted); }
    .legal-history-item strong { color:var(--text); display:block; margin-bottom:3px; }
    .legal-consumer-preview { margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
    .legal-consumer-preview-head { display:flex; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .legal-consumer-preview-head strong { font-size:13px; }
    .legal-consumer-preview-head span { color:var(--muted); font-size:11px; }
    .legal-preview-devices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .legal-device { border:1px solid var(--border); border-radius:14px; padding:13px; min-height:155px; background:linear-gradient(180deg,#101421,#0b0e18); overflow:hidden; }
    .legal-device small { color:var(--cyan); font-weight:800; letter-spacing:.08em; }
    .legal-device h4 { margin:12px 0 8px; font-size:15px; }
    .legal-device p { margin:0; color:var(--muted); white-space:pre-wrap; overflow-wrap:anywhere; font-size:11px; line-height:1.55; max-height:120px; overflow:auto; }
    .legal-counter { color:var(--muted-2); font-size:10px; font-weight:500; margin-left:auto; }
    .deletion-row-note { font-size:12px; color:var(--muted); margin-bottom:8px; }
    .warn { border:1px solid #89444e; background:#371f24; color:#ffbdc4; border-radius:8px; padding:10px; font-size:12px; }
    .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin:8px 0 12px; }
    .metric { border:1px solid var(--border); background:rgba(255,255,255,0.02); border-radius:12px; padding:10px; }
    .metric .k { font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:6px; }
    .metric .n { font-size:22px; font-weight:700; color:var(--text); }
    .analytics-toolbar { display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px; margin-bottom:10px; padding:10px; border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,0.02); }
    .analytics-toolbar .f { display:flex; flex-direction:column; gap:4px; }
    .analytics-toolbar .f label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; }
    .funnel-grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin:8px 0 12px; }
    .funnel-step { border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,0.02); padding:10px; }
    .funnel-step .s { font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:6px; }
    .funnel-step .v { font-size:22px; font-weight:700; }
    .funnel-step .r { font-size:12px; color:var(--success); margin-top:4px; }
    .profiles-pagination { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; color:var(--muted); font-size:12px; flex-wrap:wrap; }
    .profiles-pagination .controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .profiles-pagination .btn { margin-right:0; }
    .bulk-toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:10px 0 12px; padding:10px; border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,0.02); flex-wrap:wrap; }
    .bulk-toolbar .bulk-left { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .bulk-toolbar .bulk-actions { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .profile-identity { display:flex; flex-direction:column; gap:3px; min-width:0; }
    .profile-identity strong, .profile-identity span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .profile-identity .platform-tag { align-self:flex-start; max-width:100%; margin-top:4px; }
    .cell-stack { display:flex; flex-direction:column; gap:3px; }
    .cell-stack small { color:var(--muted); }
    .state-note { color:var(--muted); font-size:12px; }
    .detail-section { margin:12px 0; padding:12px; border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,.018); }
    .detail-section h3 { margin-top:0; }
    .technical-evidence { margin-top:12px; border-top:1px solid var(--border); padding-top:10px; }
    .bulk-counter { display:inline-flex; align-items:center; border:1px solid var(--border); background:rgba(255,255,255,0.06); color:var(--text); border-radius:999px; padding:4px 8px; font-weight:700; }
    .table-scroll { overflow:auto; border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,0.015); }
    .table-scroll--data table { min-width:680px; }
    .table-scroll--wide table { min-width:920px; }
    .table-scroll--wide th:first-child { width:40%; }
    .table-scroll--data th { white-space:nowrap; word-break:normal; }
    .table-scroll--trend { max-height:320px; }
    .table-scroll table { margin:0; }
    .table-scroll thead th { position:sticky; top:0; z-index:2; background:rgba(19,25,36,0.95); }
    .table-scroll::-webkit-scrollbar { width:10px; height:10px; }
    .table-scroll::-webkit-scrollbar-track { background:rgba(255,255,255,0.03); border-radius:10px; }
    .table-scroll::-webkit-scrollbar-thumb { background:rgba(132,167,214,0.42); border-radius:10px; }
    .table-scroll::-webkit-scrollbar-thumb:hover { background:rgba(132,167,214,0.62); }
    .bulk-select-cell { width:42px; text-align:center; }
    .bulk-select-cell input { cursor:pointer; }
    .list-compact { margin:0; padding-left:18px; }
    .list-compact li { margin-bottom:6px; }
    hr { border:none; border-top:1px solid var(--border); margin:14px 0; }

    .admin-page { display:flex; flex-direction:column; gap:14px; }
    .admin-summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    .admin-summary-card { min-width:0; border:1px solid var(--border); border-radius:14px; padding:14px; background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.012)); }
    .admin-summary-card .label { color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.045em; text-transform:uppercase; }
    .admin-summary-card .value { margin-top:10px; font-size:25px; font-weight:760; letter-spacing:-.02em; }
    .admin-summary-card .meta { margin-top:5px; color:var(--muted-2); font-size:11px; }
    .admin-section { border:1px solid var(--border); border-radius:15px; background:rgba(255,255,255,.012); overflow:hidden; }
    .admin-section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:14px 15px; border-bottom:1px solid var(--border); }
    .admin-section-head h2, .admin-section-head h3 { margin:0; font-size:16px; }
    .admin-section-head p { margin:4px 0 0; color:var(--muted); font-size:12px; }
    .admin-section-body { padding:14px 15px; }
    .case-title { display:flex; flex-direction:column; gap:4px; min-width:210px; }
    .case-title strong { color:var(--text); font-size:13px; }
    .case-title small, .case-meta { color:var(--muted); font-size:11px; line-height:1.45; }
    .case-subject { max-width:390px; color:var(--muted); font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
    .case-actions { display:flex; align-items:center; justify-content:flex-end; gap:7px; }
    .workflow-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .workflow-field { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .workflow-field.is-wide { grid-column:1/-1; }
    .workflow-field label { color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.045em; text-transform:uppercase; }
    .workflow-field input, .workflow-field select, .workflow-field textarea { width:100%; }
    .workflow-field textarea { min-height:88px; resize:vertical; border:1px solid var(--border); border-radius:10px; padding:9px 10px; background:rgba(21,28,40,0.74); color:var(--text); }
    .action-review { display:none; margin-top:10px; border:1px solid rgba(255,196,109,.38); border-radius:11px; padding:11px; background:rgba(255,196,109,.07); }
    .action-review.is-open { display:block; }
    .action-review p { margin:0 0 10px; color:#f5d9a8; font-size:12px; line-height:1.5; }
    .evidence-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:999px; padding:4px 8px; color:var(--muted); background:rgba(255,255,255,.025); font-size:11px; font-weight:700; }
    .evidence-chip.is-ready { color:#a8f1d2; border-color:rgba(69,216,155,.32); background:rgba(69,216,155,.07); }
    .snapshot-strip { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border:1px solid var(--border); border-radius:13px; padding:11px 13px; background:rgba(255,255,255,.018); }
    .snapshot-strip p { margin:0; color:var(--muted); font-size:12px; line-height:1.5; }
    .activity-line { display:flex; flex-direction:column; gap:4px; min-width:240px; }
    .activity-line strong { font-size:13px; line-height:1.45; }
    .activity-line small { color:var(--muted); font-size:11px; line-height:1.45; }
    .filter-grid { display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:9px; }
    .filter-grid .workflow-field { justify-content:flex-end; }
    .filter-grid .filter-action { align-self:end; min-height:39px; }
    .insight-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .insight-card { border:1px solid var(--border); border-radius:13px; padding:13px; background:rgba(255,255,255,.014); }
    .insight-card.is-warn { border-color:rgba(255,196,109,.34); background:rgba(255,196,109,.055); }
    .insight-card.is-danger { border-color:rgba(255,102,126,.36); background:rgba(255,102,126,.055); }
    .insight-card h3 { margin:0 0 6px; font-size:14px; }
    .insight-card p { margin:0; color:var(--muted); font-size:12px; line-height:1.5; }
    .insight-card .next { display:block; margin-top:8px; color:var(--text); font-weight:700; }
    .signal-chart { border:1px solid var(--border); border-radius:13px; padding:12px; background:linear-gradient(180deg,rgba(82,103,220,.075),rgba(255,255,255,.01)); overflow:hidden; }
    .signal-chart svg { display:block; width:100%; height:230px; }
    .signal-chart .chart-axis { display:flex; justify-content:space-between; gap:10px; margin-top:6px; color:var(--muted-2); font-size:10px; }
    .signal-chart .chart-legend { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:8px; color:var(--muted); font-size:11px; }

    .dashboard-chart-note { margin-top:2px; color:var(--muted); font-size:11px; }
    .dashboard-recent-list { list-style:none; margin:0; padding:0 4px 0 0; display:flex; flex-direction:column; gap:8px; max-height:620px; overflow-y:auto; }

    .dashboard-recent-list::-webkit-scrollbar-track { background:rgba(255,255,255,0.03); border-radius:10px; }
    .dashboard-recent-list::-webkit-scrollbar-thumb { background:rgba(132,167,214,0.42); border-radius:10px; }
    .dashboard-recent-list::-webkit-scrollbar-thumb:hover { background:rgba(132,167,214,0.62); }
    .dashboard-recent-list li { border:1px solid var(--border); border-radius:10px; background:rgba(255,255,255,0.018); padding:9px 10px; }
    .dashboard-recent-list .e { font-size:12px; color:#9ec5ff; font-weight:700; margin-bottom:4px; }
    .dashboard-recent-list .u { font-size:13px; color:var(--text); margin-bottom:4px; }
    .dashboard-recent-list .m { font-size:11px; color:var(--muted); margin-bottom:3px; }
    .dashboard-recent-list .t { font-size:11px; color:var(--muted-2); }

    @media (max-width: 1180px) {
      .app-shell { grid-template-columns:1fr; }
      .sidebar { position:fixed; top:12px; bottom:12px; left:12px; width:min(320px,calc(100vw - 24px)); height:auto; transform:translateX(calc(-100% - 24px)); transition:transform .2s ease; }
      .sidebar.is-open { transform:translateX(0); }
      .sidebar-backdrop.is-open { display:block; }
      .sidebar-toggle { display:inline-flex; }
      .top-search input { min-width:220px; }
      .dashboard-columns { grid-template-columns:1fr; }
      .overview-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }

    @media (max-width: 760px) {
      body { padding:12px; }
      .app-shell { min-height:calc(100vh - 24px); gap:10px; }
      .topbar { padding:12px; border-radius:14px; }
      .topbar h1 { font-size:22px; }
      .topbar { align-items:flex-start; flex-wrap:wrap; }
      .topbar-left { min-width:0; }
      .top-search { width:100%; }
      .top-search input { min-width:0; width:100%; }

      .detail-drawer { inset:0; width:100%; border-radius:0; border-left:0; border-right:0; }
      .detail-drawer-head { padding:12px; }
      .detail-drawer-body { padding:12px 12px 22px; }
    }

    function relativeAge(value){
      const stamp=new Date(value).getTime();
      if(!Number.isFinite(stamp)) return 'Zaman bilinmiyor';
      const minutes=Math.max(0,Math.floor((Date.now()-stamp)/60000));
      if(minutes<1) return 'Az önce';
      if(minutes<60) return `${minutes} dk önce`;
      const hours=Math.floor(minutes/60);
      if(hours<24) return `${hours} sa önce`;
      const days=Math.floor(hours/24);
      return `${days} gün önce`;
    }
    function relativeUntil(value){
      const stamp=new Date(value).getTime();
      if(!Number.isFinite(stamp)) return 'Süre bilinmiyor';
      const minutes=Math.ceil((stamp-Date.now())/60000);
      if(minutes<=0) return 'Süresi dolmuş';
      if(minutes<60) return `${minutes} dk kaldı`;
      const hours=Math.ceil(minutes/60);
      if(hours<24) return `${hours} sa kaldı`;
      return `${Math.ceil(hours/24)} gün kaldı`;
    }
    function workflowTone(value){
      const key=String(value||'').toLowerCase();
      if(['resolved','dismissed'].includes(key)) return 'is-ok';
      if(['new','received','investigating','insufficient_info'].includes(key)) return 'is-warn';
      if(key==='critical') return 'is-danger';
      return '';
    }
    function priorityTone(value){
      const key=String(value||'').toLowerCase();
      if(key==='critical') return 'is-danger';
      if(key==='high') return 'is-warn';
      return '';
    }

    function humanizeAnalyticsKey(key){
      const norm=String(key||'').trim().toLowerCase();
      if(!norm) return '-';
      const words=norm.split(/[_-]+/).filter(Boolean).map((part)=>{
        const translated=ANALYTICS_TOKEN_LABELS[part];
        if(translated) return translated;
        return part.charAt(0).toUpperCase()+part.slice(1);
      });
      return words.join(' ');
    }
    function analyticsEventLabel(v){
      const key=String(v||'').trim().toLowerCase();
      if(!key) return '-';
      return ANALYTICS_EVENT_LABELS[key]||humanizeAnalyticsKey(key);
    }
    function analyticsMetaLabel(key){
      const normalized=String(key||'').trim().toLowerCase();
      return ANALYTICS_META_LABELS[normalized]||humanizeAnalyticsKey(normalized);
    }
    function analyticsMetaSummary(meta){
      if(meta===null||meta===undefined) return 'Detay yok';
      let value=meta;
      if(typeof value==='string'){
        const trimmed=value.trim();
        if(!trimmed) return 'Detay yok';
        try{ value=JSON.parse(trimmed); }
        catch{
          return trimmed.length>120?`${trimmed.slice(0,117)}...`:trimmed;
        }
      }
      if(typeof value!=='object' || !value || Array.isArray(value)){
        const text=String(value||'').trim();
        return text?(text.length>120?`${text.slice(0,117)}...`:text):'Detay yok';
      }
      const parts=[];
      Object.entries(value).forEach(([k,v])=>{
        if(parts.length>=3) return;
        if(v===null||v===undefined||v==='') return;
        if(typeof v==='object') return;
        const raw=String(v).trim();
        if(!raw) return;
        const protectedValue=/(^|_)(id|token|ip|email|device|user)($|_)/i.test(k)?maskAdminIdentifier(raw):raw;
        const text=protectedValue.length>36?`${protectedValue.slice(0,33)}...`:protectedValue;
        parts.push(`${analyticsMetaLabel(k)}: ${text}`);
      });
      return parts.length?parts.join(' | '):'Detay yok';
    }
    function analyticsPlatformLabel(v){
      const p=String(v||'').trim().toLowerCase();
      if(!p) return '-';
      if(p==='all') return 'Tümü';
      if(p==='unknown') return 'Bilinmiyor';
      if(p==='android') return 'Android';
      if(p==='ios') return 'iOS';
      if(p==='web'||p==='browser'||p==='desktop') return 'Web';
      return humanizeAnalyticsKey(p);
    }
    function compactMetric(n){
      const val=Number(n||0);
      if(!Number.isFinite(val)) return '0';
      if(Math.abs(val)>=1000000) return `${(val/1000000).toFixed(1)}M`;
      if(Math.abs(val)>=1000) return `${(val/1000).toFixed(1)}K`;
      return String(Math.round(val));
    }
    function dashboardDateLabel(value){
      if(!value) return '-';
      const dt=new Date(value);
      if(Number.isNaN(dt.getTime())) return '-';
      return dt.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'});
    }
    function renderDashboardMiniChart(rows){
      const ordered=[...(Array.isArray(rows)?rows:[])].sort((a,b)=>new Date(a?.bucket||0)-new Date(b?.bucket||0));
      if(!ordered.length){
        return `
          <div class="dashboard-chart">
            <svg viewBox="0 0 920 220" preserveAspectRatio="none" role="img" aria-label="Aktivite trendi">
              <line x1="18" y1="160" x2="902" y2="160" stroke="rgba(255,255,255,0.20)" stroke-width="2" stroke-dasharray="6 6" />
              <text x="20" y="148" fill="rgba(182,199,225,0.78)" font-size="12">Grafik icin yeterli veri yok</text>
            </svg>
            <div class="axis"><span>-</span><span>-</span><span>-</span></div>
            <div class="dashboard-chart-note">Veri geldikce trend otomatik olusur.</div>
          </div>
        `;
      }
      const values=ordered.map((row)=>(
        Number(row?.unique_arrivals||0)+
        Number(row?.match_attempts||0)+
        Number(row?.offers||0)+
        Number(row?.accepts||0)+
        Number(row?.auto_accepts||0)+
        Number(row?.rejects||0)+
        Number(row?.chats_started||0)
      ));
      const hasActivity=values.some((v)=>v>0);
      if(!hasActivity){
        return `
          <div class="dashboard-chart">
            <svg viewBox="0 0 920 220" preserveAspectRatio="none" role="img" aria-label="Aktivite trendi">
              <line x1="18" y1="160" x2="902" y2="160" stroke="rgba(255,255,255,0.24)" stroke-width="2.2" />
              <text x="20" y="148" fill="rgba(182,199,225,0.78)" font-size="12">Son 24 saatte aktiviteler sifira yakin</text>
            </svg>
            <div class="axis">
              <span>${esc(dashboardDateLabel(ordered[0]?.bucket))}</span>
              <span>${esc(dashboardDateLabel(ordered[Math.floor((ordered.length-1)/2)]?.bucket))}</span>
              <span>${esc(dashboardDateLabel(ordered[ordered.length-1]?.bucket))}</span>
            </div>
            <div class="dashboard-chart-note">Hareket arttiginda cizgi burada belirginlesir.</div>
          </div>
        `;
      }
      const width=920;
      const height=220;
      const padX=18;
      const padTop=14;
      const padBottom=26;
      const innerHeight=height-padTop-padBottom;
      const max=Math.max(1,...values);
      const range=max;
      const step=values.length>1?(width-(padX*2))/(values.length-1):0;
      const points=values.map((v,idx)=>{
        const x=padX+(idx*step);
        const y=padTop+((max-v)/range)*innerHeight;
        return {x,y};
      });
      const linePath=points.map((pt,idx)=>`${idx===0?'M':'L'} ${pt.x.toFixed(2)} ${pt.y.toFixed(2)}`).join(' ');
      const last=points[points.length-1];
      const first=points[0];
      const baseY=height-padBottom;
      const areaPath=`${linePath} L ${last.x.toFixed(2)} ${baseY.toFixed(2)} L ${first.x.toFixed(2)} ${baseY.toFixed(2)} Z`;

      let gridLines='';
      for(let i=0;i<4;i++){
        const ratio=i/3;
        const y=padTop+(innerHeight*ratio);
        const label=compactMetric(max-(max*ratio));
        gridLines+=`<line x1="${padX}" y1="${y.toFixed(2)}" x2="${(width-padX).toFixed(2)}" y2="${y.toFixed(2)}" stroke="rgba(255,255,255,0.08)" stroke-width="1" />`;
        gridLines+=`<text x="2" y="${(y+4).toFixed(2)}" fill="rgba(182,199,225,0.78)" font-size="11">${label}</text>`;
      }

      return `
        <div class="dashboard-chart">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="Son 24 saat aktivite trendi">
            <defs>
              <linearGradient id="dashTrendFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#9366ff" stop-opacity="0.36" />
                <stop offset="100%" stop-color="#9366ff" stop-opacity="0.02" />
              </linearGradient>
              <linearGradient id="dashTrendStroke" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#9f78ff" />
                <stop offset="100%" stop-color="#69beff" />
              </linearGradient>
            </defs>
            ${gridLines}
            <path d="${areaPath}" fill="url(#dashTrendFill)" />
            <path d="${linePath}" fill="none" stroke="url(#dashTrendStroke)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="${last.x.toFixed(2)}" cy="${last.y.toFixed(2)}" r="5" fill="#8162ff" stroke="#d6e3ff" stroke-width="1.5" />
          </svg>
          <div class="axis">
            <span>${esc(dashboardDateLabel(ordered[0]?.bucket))}</span>
            <span>${esc(dashboardDateLabel(ordered[Math.floor((ordered.length-1)/2)]?.bucket))}</span>
            <span>${esc(dashboardDateLabel(ordered[ordered.length-1]?.bucket))}</span>
          </div>
          <div class="dashboard-chart-note">Son saat: ${compactMetric(values[values.length-1])} | Zirve: ${compactMetric(Math.max(...values))}</div>
        </div>
      `;
    }

    function handleAdminKeydown(event){
      const sidebar=document.getElementById('admin-sidebar');
      const drawer=document.getElementById('detail-drawer');
      if(event.key==='Escape'){
        if(drawer?.classList.contains('is-open')) closeDetailDrawer();
        else closeAdminNav();
        return;
      }
      if(event.key==='Tab'&&drawer?.classList.contains('is-open')){
        const drawerFocusable=[...drawer.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')];
        if(!drawerFocusable.length) return;
        const firstDrawer=drawerFocusable[0];
        const lastDrawer=drawerFocusable[drawerFocusable.length-1];
        if(event.shiftKey&&document.activeElement===firstDrawer){ event.preventDefault(); lastDrawer.focus(); }
        else if(!event.shiftKey&&document.activeElement===lastDrawer){ event.preventDefault(); firstDrawer.focus(); }
        return;
      }
      if(event.key!=='Tab'||!sidebar?.classList.contains('is-open')) return;
      const focusable=[...sidebar.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')];
      if(!focusable.length) return;
      const first=focusable[0];
      const last=focusable[focusable.length-1];
      if(event.shiftKey&&document.activeElement===first){ event.preventDefault(); last.focus(); }
      else if(!event.shiftKey&&document.activeElement===last){ event.preventDefault(); first.focus(); }
    }

    function deletionStatusTone(status){
      const key=String(status||'').toLowerCase();
      if(key==='completed') return 'is-ok';
      if(['processing','failed_retryable'].includes(key)) return 'is-danger';
      if(['requested','reviewing','approved'].includes(key)) return 'is-warn';
      return '';
    }
    function deletionSlaText(value){
      const stamp=new Date(value).getTime();
      if(!Number.isFinite(stamp)) return {label:'SLA bilinmiyor',tone:''};
      const remainingMinutes=Math.ceil(((stamp+(72*60*60*1000))-Date.now())/60000);
      if(remainingMinutes<=0) return {label:`${Math.max(1,Math.ceil(Math.abs(remainingMinutes)/60))} saat aşıldı`,tone:'is-danger'};
      if(remainingMinutes<24*60) return {label:`${Math.ceil(remainingMinutes/60)} saat kaldı`,tone:'is-warn'};
      return {label:`${Math.ceil(remainingMinutes/(24*60))} gün kaldı`,tone:'is-ok'};
    }
    function resolutionMetric(value,count){
      if(!Number(count||0)) return 'Veri yok';
      const hours=Number(value);
      if(!Number.isFinite(hours)) return 'Veri yok';
      if(hours<1) return `${Math.round(hours*60)} dk`;
      return `${hours.toFixed(hours<10?1:0)} saat`;
    }

          <article class="admin-summary-card"><div class="label">Ortalama çözüm</div><div class="value">${esc(resolutionMetric(m.avg_resolution_hours_30d,m.resolution_count_30d))}</div><div class="meta">Son 30 gün</div></article>
          <article class="admin-summary-card"><div class="label">Medyan çözüm</div><div class="value">${esc(resolutionMetric(m.median_resolution_hours_30d,m.resolution_count_30d))}</div><div class="meta">Son 30 gün · ${Number(m.resolution_count_30d||0)} sonuç</div></article>
        </div>
        <section class="admin-section">
          <div class="admin-section-head"><div><h2>Silme talebi kuyruğu</h2><p>Talep yaşı, SLA ve son işlem kanıtını inceleyin; kalıcı işlem yalnız detay ekranından yapılır.</p></div><div class="case-actions"><select id="deletion-status-filter" aria-label="Silme talebi durumu" onchange="changeDeletionStatus(this.value)"><option value="pending" ${status==='pending'?'selected':''}>Bekliyor</option><option value="rejected" ${status==='rejected'?'selected':''}>Reddedildi</option><option value="completed" ${status==='completed'?'selected':''}>Tamamlandı</option></select><button class="btn btn-refresh" onclick="loadDeletionRequests()">Yenile</button></div></div>`;

    async function loadDeletionRequests(){
      const c=document.getElementById('content');
      c.innerHTML='<p style="padding:16px;color:#9aa8c0">Silme talepleri yukleniyor...</p>';
      try{
        const [listRes,metricsRes]=await Promise.all([
          fetch(`/admin/deletion-requests?status=${encodeURIComponent(currentDeletionStatus)}`),
          fetch('/admin/deletion-requests/metrics')
        ]);
        const listJson=await listRes.json();

        if(!listRes.ok) throw new Error(listJson.error||'Silme talepleri okunamadi.');

      }catch(e){
        c.innerHTML=`<p style="padding:16px;color:#ff6b7a">Silme talepleri yuklenemedi: ${esc(e.message||e)}</p>`;

    function auditActionLabel(value){ return AUDIT_ACTION_LABELS[String(value||'').toUpperCase()]||'yönetim işlemi yaptı'; }
    function auditEntityLabel(value){ return AUDIT_ENTITY_LABELS[String(value||'').toLowerCase()]||String(value||'kayıt').replaceAll('_',' '); }
    function auditFamily(value){
      const key=String(value||'').toUpperCase();
      if(key.startsWith('DELETION_')||key.startsWith('FRIEND_')) return 'Hesap işlemi';
      if(['BAN','UNBAN','BULK_BAN','BULK_UNBAN','UNBLOCK'].includes(key)) return 'Moderasyon';
      if(key.startsWith('NOTIFY_')) return 'Bildirim';
      if(key.startsWith('LEGAL_')) return 'Yasal içerik';
      return 'Diğer';
    }
    function auditTone(value){
      const key=String(value||'').toUpperCase();
      if(key.includes('UNBAN')||key.includes('REACTIVATE')||key.includes('ADD')) return 'is-ok';
      if(key.includes('DELETE')||key.includes('BAN')||key.includes('REJECT')) return 'is-danger';
      return '';
    }
    function auditPayloadSummary(payload){
      const data=payload&&typeof payload==='object'?payload:{};
      const parts=[];
      if(data.reason) parts.push(`Gerekçe: ${String(data.reason).slice(0,110)}`);
      if(data.note) parts.push(`Not: ${String(data.note).slice(0,110)}`);
      if(data.removedCount!==undefined) parts.push(`${Number(data.removedCount)||0} kayıt etkilendi`);
      if(data.durationHours!==undefined) parts.push(`${Number(data.durationHours)||0} saat`);
      return parts.join(' · ')||'İşlem ayrıntısı teknik kanıtta';
    }

    async function loadAuditLogs(){
      const c=document.getElementById('content');
      const actor=val('audit-actor').trim();
      const family=val('audit-family').trim();
      const entity=val('audit-entity').trim();
      const from=val('audit-from').trim();
      const to=val('audit-to').trim();
      c.innerHTML='<p style="padding:16px;color:#9aa8c0">Audit loglar yukleniyor...</p>';
      try{
        const qs=new URLSearchParams();
        if(actor) qs.set('actor',actor);
        if(family) qs.set('family',family);
        if(entity) qs.set('entity',entity);
        if(from) qs.set('from',new Date(from).toISOString());
        if(to) qs.set('to',new Date(to).toISOString());
        qs.set('limit','200');
        const r=await fetch(`/admin/audit-logs?${qs.toString()}`);
        const x=await r.json();

    const formatPerfMs=(value)=>value==null?'Veri yok':`${Number(value).toFixed(1)} ms`;
    const formatPerfRate=(value)=>value==null?'Veri yok':`${Number(value).toFixed(2)}%`;
    function percentageDelta(current,previous){
      const now=Number(current); const before=Number(previous);
      if(!Number.isFinite(now)||!Number.isFinite(before)||before===0) return null;
      return ((now-before)/before)*100;
    }
    function deltaBadge(current,previous,inverse=false){
      const delta=percentageDelta(current,previous);
      if(delta===null) return '<span class="delta">Karşılaştırma yok</span>';
      const good=inverse?delta<=0:delta>=0;
      const cls=Math.abs(delta)<0.05?'':good?'is-up':'is-down';
      const sign=delta>0?'+':'';
      return `<span class="delta ${cls}">${sign}${delta.toFixed(1)}% önceki dönem</span>`;
    }
    function trimZeroSeries(series,keys){
      const list=Array.isArray(series)?series:[];
      const active=(row)=>keys.some((key)=>Number(row?.[key]||0)!==0);
      let start=list.findIndex(active);
      if(start<0) return [];
      let end=list.length-1;
      while(end>start&&!active(list[end])) end--;
      return list.slice(start,end+1);
    }
    function renderSignalChart(series,specs,{thresholds=[]}={}){
      const list=Array.isArray(series)?series:[];
      const width=800,height=220,padX=30,padY=20;
      const values=list.flatMap((row)=>specs.map((spec)=>Number(row?.[spec.key])).filter(Number.isFinite));
      const thresholdValues=thresholds.map((item)=>Number(item.value)).filter(Number.isFinite);
      const max=Math.max(1,...values,...thresholdValues);
      if(!list.length||!values.length) return '<div class="admin-state"><div class="admin-state-icon">∿</div><div><h3>Trend üretmek için veri yok</h3><p>Seçilen zaman aralığında anlamlı ölçüm bulunmadı.</p></div></div>';
      const x=(index)=>padX+((width-(padX*2))*(list.length===1?0:index/(list.length-1)));
      const y=(value)=>height-padY-((Math.max(0,Number(value)||0)/max)*(height-(padY*2)));
      const lines=specs.map((spec)=>{const points=list.map((row,index)=>`${x(index).toFixed(1)},${y(row?.[spec.key]).toFixed(1)}`).join(' ');return `<polyline fill="none" stroke="${spec.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${points}"/>`;}).join('');
      const thresholdLines=thresholds.map((item)=>`<g><line x1="${padX}" y1="${y(item.value)}" x2="${width-padX}" y2="${y(item.value)}" stroke="${item.color}" stroke-width="1" stroke-dasharray="7 6"/><text x="${width-padX-4}" y="${Math.max(12,y(item.value)-5)}" text-anchor="end" fill="${item.color}" font-size="10">${esc(item.label)}</text></g>`).join('');

          fetch(`/admin/performance/overview?hours=${hours}`),
          fetch(`/admin/performance/timeseries?hours=${hours}`),

        if(!overviewRes.ok) throw new Error(overviewJson.error||'Overview okunamadi.');

    const toLocalDateTimeInput=(isoValue)=>{
      if(!isoValue) return '';

      if(Number.isNaN(dt.getTime())) return '';

      return new Date(dt.getTime()-tzOffsetMs).toISOString().slice(0,16);
    };
    const toIsoFromLocalInput=(value)=>{

    function fulfilledValue(result,fallback={}){
      return result?.status==='fulfilled'?result.value:fallback;

    function dashboardIcon(name){

    function overviewCard(metric,icon,label){
      const value=saleMetricValue(metric);
      const muted=metric?.state==='value'?'':' is-muted';
      return `<article class="overview-card">
        <div class="overview-card-top"><span>${esc(label||metric?.label||'Metrik')}</span><span class="overview-card-icon">${dashboardIcon(icon)}</span></div>

    function combinedReportMetric(userMetric,supportMetric){
      if(userMetric?.state==='value'&&supportMetric?.state==='value'){
        return {state:'value',value:Number(userMetric.value||0)+Number(supportMetric.value||0),source:'user_reports + support_reports',window:{label:'Son 24 saat'},note:'Kullanıcı ve uygulama raporlarının toplamı'};
      }
      if(userMetric?.state==='no_data'||supportMetric?.state==='no_data'){
        return {state:'no_data',value:null,source:'user_reports + support_reports',window:{label:'Son 24 saat'},note:'Rapor kaynaklarından biri için yeterli veri yok'};
      }
      return {state:'unavailable',value:null,source:'user_reports + support_reports',window:{label:'Son 24 saat'},note:'Rapor kaynaklarından biri okunamadı'};
    }
    function healthDotClass(state){
      if(state==='ok') return 'ok';
      if(state==='bad') return 'bad';
      if(state==='warn') return 'warn';
      return '';
    }
    function healthCard(title,value,meta,state='warn'){
      const stateLabel={ok:'İyi',warn:'Uyarı',bad:'Kritik',unknown:'Bilinmiyor'}[state]||'Bilinmiyor';
      return `<article class="health-card">
        <div class="health-title"><span>${esc(title)}</span><span class="health-status"><span class="status-dot ${healthDotClass(state)}" aria-hidden="true"></span>${stateLabel}</span></div>
        <div class="health-value">${esc(value)}</div>
        <div class="health-meta">${esc(meta)}</div>
      </article>`;
    }
    function dashboardPerformanceSignal(performance,resultStatus,kind){
      if(resultStatus!=='fulfilled') return {value:'Kullanılamıyor',meta:'Performans servisi yanıt vermedi',state:'unknown'};
      const dataState=String(performance?.data_state||'unknown');
      const confidence=String(performance?.confidence||'unknown');
      const total=Number(performance?.total_requests||0);
      if(dataState==='no_data'||total===0) return {value:'İstek yok',meta:'Son 60 dakikada API isteği kaydedilmedi',state:'unknown'};
      if(dataState==='partial') return {value:'Kısmi veri',meta:`${total} istek · bazı ölçüm kaynakları eksik`,state:'warn'};
      if(kind==='p95'&&confidence!=='sufficient') return {value:'Düşük örneklem',meta:`${Number(performance?.sample_count||0)} örnek · en az ${Number(performance?.thresholds?.minimum_percentile_samples||0)} gerekli`,state:dataState==='stale'?'warn':'unknown'};
      const value=kind==='p95'?Number(performance?.p95_ms):Number(performance?.error_rate);
      if(!Number.isFinite(value)) return {value:'Hesaplanamadı',meta:`${total} istek · güvenilir ölçüm yok`,state:'unknown'};
      const warning=Number(kind==='p95'?performance?.thresholds?.p95_warning_ms:performance?.thresholds?.error_warning_rate);
      const critical=Number(kind==='p95'?performance?.thresholds?.p95_critical_ms:performance?.thresholds?.error_critical_rate);
      const state=dataState==='stale'?'warn':value>=critical?'bad':value>=warning?'warn':'ok';
      return {value:kind==='p95'?`${value.toFixed(1)} ms`:`%${value.toFixed(2)}`,meta:dataState==='stale'?`${total} istek · veri güncel değil`:`${total} istek · son 60 dakika`,state};
    }
    function dashboardOverallHealth(states,partial){
      if(states.includes('bad')) return {state:'bad',label:'Kritik servis sorunu var',className:'is-critical'};
      if(partial||states.includes('warn')) return {state:'warn',label:partial?'Bazı kaynaklar okunamadı; sağlam veriler gösteriliyor':'Dikkat isteyen servis göstergesi var',className:'is-partial'};
      if(states.includes('unknown')) return {state:'unknown',label:'Bazı göstergeler için değerlendirme verisi yok',className:''};
      return {state:'ok',label:'İzlenen servisler normal aralıkta',className:'is-ok'};
    }

    function openModal(title,body){document.getElementById('m_title').innerText=title;document.getElementById('m_body').innerHTML=body;document.getElementById('modal').style.display='flex';}
    function closeModal(){document.getElementById('modal').style.display='none';document.getElementById('m_body').innerHTML='';}

    function detailInitials(value){
      const parts=String(value||'?').trim().split(/\s+/).filter(Boolean);
      return parts.slice(0,2).map((part)=>part[0]||'').join('').toUpperCase()||'?';
    }
    function maskAdminIdentifier(value){
      const raw=String(value||'').trim();
      if(!raw) return 'Veri yok';
      if(raw.length<=8) return `${raw.slice(0,2)}…${raw.slice(-2)}`;
      return `${raw.slice(0,6)}…${raw.slice(-4)}`;
    }
    function profileStateLabel(value){
      const key=String(value||'unknown').toLowerCase();
      return {active:'Aktif',temp:'Süreli kısıtlı',perm:'Kalıcı yasaklı',shadow:'Gölge yasaklı',inactive:'Pasif',deleted:'Silinmiş'}[key]||'Durum bilinmiyor';
    }
    function profileStateTone(value){
      const key=String(value||'unknown').toLowerCase();
      if(key==='active') return 'is-ok';
      if(['temp','shadow','inactive'].includes(key)) return 'is-warn';
      if(['perm','deleted'].includes(key)) return 'is-danger';
      return '';
    }
    function switchDetailTab(tabId){
      document.querySelectorAll('#detail-drawer .detail-tab').forEach((button)=>{
        const active=button.dataset.detailTab===tabId;
        button.classList.toggle('is-active',active);
        button.setAttribute('aria-selected',String(active));
        button.tabIndex=active?0:-1;
      });
      document.querySelectorAll('#detail-drawer .detail-pane').forEach((pane)=>{
        pane.classList.toggle('is-active',pane.dataset.detailPane===tabId);
      });
    }
    function openDetailDrawer({title,subtitle,avatar,tabs,loading=false}){
      const drawer=document.getElementById('detail-drawer');
      const backdrop=document.getElementById('detail-drawer-backdrop');
      if(!drawer||!backdrop) return;
      if(!drawer.classList.contains('is-open')) detailDrawerReturnFocus=document.activeElement;
      document.getElementById('detail-drawer-title').textContent=title||'Detay';
      document.getElementById('detail-drawer-subtitle').textContent=subtitle||'Güvenli yönetim görünümü';
      document.getElementById('detail-drawer-avatar').textContent=avatar||detailInitials(title);
      const tabList=Array.isArray(tabs)?tabs:[];
      const drawerTabs=document.getElementById('detail-drawer-tabs');
      const drawerBody=document.getElementById('detail-drawer-body');
      drawerTabs.innerHTML=loading?'':tabList.map((tab,index)=>`<button type="button" class="detail-tab${index===0?' is-active':''}" data-detail-tab="${esc(tab.id)}" role="tab" aria-selected="${index===0?'true':'false'}" tabindex="${index===0?'0':'-1'}" onclick="switchDetailTab('${esc(tab.id)}')">${esc(tab.label)}</button>`).join('');
      drawerBody.innerHTML=loading?'<div class="admin-state"><div class="admin-state-icon">•••</div><div><h3>Profil bilgileri yükleniyor</h3><p>Bağımsız veri bölümleri güvenli biçimde hazırlanıyor.</p></div></div>':tabList.map((tab,index)=>`<section class="detail-pane${index===0?' is-active':''}" data-detail-pane="${esc(tab.id)}" role="tabpanel">${tab.html}</section>`).join('');
      drawerTabs.scrollLeft=0;
      drawerBody.scrollTop=0;
      drawer.classList.add('is-open');
      backdrop.classList.add('is-open');
      drawer.setAttribute('aria-hidden','false');
      document.body.classList.add('admin-drawer-open');
      requestAnimationFrame(()=>drawer.querySelector('.detail-drawer-close')?.focus());
    }
    function closeDetailDrawer(){
      const drawer=document.getElementById('detail-drawer');
      const backdrop=document.getElementById('detail-drawer-backdrop');
      if(!drawer||!backdrop) return;
      drawer.classList.remove('is-open');
      backdrop.classList.remove('is-open');
      drawer.setAttribute('aria-hidden','true');
      document.body.classList.remove('admin-drawer-open');
      document.getElementById('detail-drawer-tabs').innerHTML='';
      document.getElementById('detail-drawer-body').innerHTML='';
      if(detailDrawerReturnFocus instanceof HTMLElement) detailDrawerReturnFocus.focus();
      detailDrawerReturnFocus=null;
    }

      const technicalHtml=`<section class="detail-card"><h3>Maskeli teknik kapsam</h3><div class="detail-kv-grid"><div class="detail-kv"><span class="label">Gösterilen kayıt</span><span class="value">${Math.min(items.length,20)} / ${items.length}</span></div><div class="detail-kv"><span class="label">Örnekleme</span><span class="value">Yalnız eşik üstü istekler</span></div></div></section>${items.length?`<section class="detail-card"><h3>İstek referansları</h3><ul class="detail-list">${items.slice(0,20).map((item)=>`<li><strong>${esc(item.route||'Bilinmeyen route')}</strong><br>Referans: ${esc(maskAdminIdentifier(item.request_id))}<br>Yanıt boyutu: ${Number(item.response_size_bytes||0)} bayt · Örnek nedeni: ${esc(item.sample_reason||'Yavaş istek')}</li>`).join('')}</ul></section>`:''}`;
      openDetailDrawer({title:'Performans kanıtı',subtitle:`${items.length} yavaş istek · tanımlayıcılar maskeli`,avatar:'∿',tabs:[{id:'slow',label:'Yavaş istekler',html:summaryHtml},{id:'technical',label:'Teknik kapsam',html:technicalHtml}]});
    }

    function openAnalyticsEventDetails(key){
      const item=analyticsEventRows.get(String(key));
      if(!item) return;
      const eventLabel=analyticsEventLabel(item.event_name);
      const username=item.username||item.display_name||'Anonim';
      const overviewHtml=`<div class="detail-hero"><div class="detail-kv"><span class="label">Ürün olayı</span><span class="value">${esc(eventLabel)}</span></div><div class="detail-kv"><span class="label">Kullanıcı</span><span class="value">${esc(username)}</span></div><div class="detail-kv"><span class="label">Platform</span><span class="value">${esc(analyticsPlatformLabel(item.platform))}</span></div></div><section class="detail-card"><h3>Olay özeti</h3><div class="detail-kv-grid"><div class="detail-kv"><span class="label">Zaman</span><span class="value">${d(item.created_at)}</span></div><div class="detail-kv"><span class="label">Güvenli özet</span><span class="value">${esc(analyticsMetaSummary(item.metadata))}</span></div></div></section>`;
      const technicalHtml=`<section class="detail-card"><h3>Maskeli teknik kanıt</h3><p class="state-note">Tanımlayıcılar yalnız olay ilişkilendirmesi içindir ve maskeli gösterilir.</p><div class="detail-kv-grid"><div class="detail-kv"><span class="label">Olay kodu</span><span class="value">${esc(item.event_name||'Veri yok')}</span></div><div class="detail-kv"><span class="label">Olay referansı</span><span class="value">${esc(maskAdminIdentifier(item.id))}</span></div><div class="detail-kv"><span class="label">Profil referansı</span><span class="value">${esc(maskAdminIdentifier(item.user_id))}</span></div><div class="detail-kv"><span class="label">İstemci</span><span class="value">${esc(maskAdminIdentifier(item.client_id))}</span></div><div class="detail-kv"><span class="label">Cihaz</span><span class="value">${esc(maskAdminIdentifier(item.device_id))}</span></div><div class="detail-kv"><span class="label">Eşleşme</span><span class="value">${esc(maskAdminIdentifier(item.match_id||item.conversation_id))}</span></div></div></section><details class="technical-evidence"><summary>Sanitize metadata alanlarını göster</summary><div style="margin-top:10px">${auditTechnicalRows(item.metadata)}</div></details>`;
      openDetailDrawer({title:eventLabel,subtitle:`${username} · ${relativeAge(item.created_at)}`,avatar:'↗',tabs:[{id:'event',label:'Olay',html:overviewHtml},{id:'technical',label:'Teknik kanıt',html:technicalHtml}]});
    }

    async function openSupportDetails(id){
      openDetailDrawer({title:'Uygulama raporu',subtitle:'Vaka bilgileri yükleniyor',avatar:'!',tabs:[],loading:true});
      try{
        const r=await fetch(`/admin/support-report/${id}`); const x=await r.json(); if(!r.ok) throw new Error(x.error||'hata');
        const it=x.item||{}; const media=Array.isArray(x.media)?x.media:[]; const history=Array.isArray(x.history)?x.history:[]; const group=x.group||{};
        const safeId=String(it.id||id).replace(/[^a-zA-Z0-9_-]/g,'');
        const statusKey=String(it.workflow_status||'new').toLowerCase();
        const priorityKey=String(it.priority||'normal').toLowerCase();
        const overviewHtml=`<div class="detail-hero"><div class="detail-kv"><span class="label">İş akışı</span><span class="status-pill ${workflowTone(statusKey)}">${esc(WORKFLOW_LABELS[statusKey]||'Durum bilinmiyor')}</span></div><div class="detail-kv"><span class="label">Öncelik</span><span class="status-pill ${priorityTone(priorityKey)}">${esc(PRIORITY_LABELS[priorityKey]||'Normal')}</span></div><div class="detail-kv"><span class="label">Etki</span><span class="value">${Number(group.report_count||1)} rapor · ${Number(group.affected_users||0)} kullanıcı</span></div></div><section class="detail-card"><h3>Vaka özeti</h3><div class="detail-kv-grid"><div class="detail-kv"><span class="label">Konu</span><span class="value">${esc(subject(it.subject))}</span></div><div class="detail-kv"><span class="label">Kullanıcı</span><span class="value">${esc(it.username_snapshot||'Anonim')}</span></div><div class="detail-kv"><span class="label">İlk görülme</span><span class="value">${d(group.first_seen||it.created_at)}</span></div><div class="detail-kv"><span class="label">Son görülme</span><span class="value">${d(group.last_seen||it.updated_at)}</span></div><div class="detail-kv"><span class="label">Sorumlu</span><span class="value">${esc(it.workflow_owner||'Atanmamış')}</span></div><div class="detail-kv"><span class="label">E-posta teslimi</span><span class="value">${esc(brevo(it.delivery_status))}</span></div></div></section>`;
        const reportHtml=`<section class="detail-card"><h3>Kullanıcı bildirimi</h3><div class="desc">${esc(it.description||'Açıklama paylaşılmadı.')}</div><div class="detail-kv-grid" style="margin-top:10px"><div class="detail-kv"><span class="label">Bildirim zamanı</span><span class="value">${d(it.client_timestamp||it.created_at)}</span></div><div class="detail-kv"><span class="label">Sunucu kayıt zamanı</span><span class="value">${d(it.created_at)}</span></div></div></section>`;
        let evidenceHtml='<section class="detail-card"><h3>Medya kanıtı</h3>';
        if(!media.length) evidenceHtml+='<div class="admin-state"><div class="admin-state-icon">○</div><div><h3>Medya eklenmemiş</h3><p>Bu vaka kullanıcı açıklaması ve teknik sinyaller üzerinden incelenebilir.</p></div></div>';
        else{
          evidenceHtml+='<div class="media">';
          media.forEach((m)=>{
            const src=`/admin/support-report-media/${m.id}/content`;
            const preview=m.media_kind==='video'?`<video controls src="${src}"></video>`:`<img src="${src}" alt="${esc(m.file_name||'medya')}" />`;
            evidenceHtml+=`<div class="m">${preview}<div class="case-meta" style="margin-top:6px"><strong>${esc(m.file_name||'Kanıt')}</strong><br>${esc(m.mime_type||'Tür bilinmiyor')} · ${(Number(m.size_bytes||0)/1024).toFixed(1)} KB</div></div>`;
          });
          evidenceHtml+='</div>';
        }
        evidenceHtml+=`</section><section class="detail-card"><h3>İşlem geçmişi</h3>${history.length?`<ul class="detail-list">${history.map((row)=>`<li><strong>${d(row.created_at)} · ${esc(row.actor_admin||'Yönetici')}</strong><br>${esc(WORKFLOW_LABELS[row.from_status]||row.from_status||'Başlangıç')} → ${esc(WORKFLOW_LABELS[row.to_status]||row.to_status||'Durum bilinmiyor')}<br>${esc(row.reason||'Gerekçe kaydedilmemiş')}</li>`).join('')}</ul>`:'<p class="state-note">Henüz iş akışı işlemi yok.</p>'}</section>`;
        const statusOptions=Object.entries(WORKFLOW_LABELS).map(([value,label])=>`<option value="${value}" ${value===statusKey?'selected':''}>${esc(label)}</option>`).join('');
        const priorityOptions=Object.entries(PRIORITY_LABELS).map(([value,label])=>`<option value="${value}" ${value===priorityKey?'selected':''}>${esc(label)}</option>`).join('');
        const workflowHtml=`<section class="detail-card"><h3>İş akışını güncelle</h3><div class="workflow-form"><div class="workflow-field"><label for="support-status-${safeId}">Yeni durum</label><select id="support-status-${safeId}">${statusOptions}</select></div><div class="workflow-field"><label for="support-priority-${safeId}">Öncelik</label><select id="support-priority-${safeId}">${priorityOptions}</select></div><div class="workflow-field is-wide"><label for="support-owner-${safeId}">Sorumlu</label><input id="support-owner-${safeId}" value="${esc(it.workflow_owner||'')}" placeholder="Yönetici veya ekip adı"></div><div class="workflow-field is-wide"><label for="support-note-${safeId}">Not ve gerekçe</label><textarea id="support-note-${safeId}" placeholder="Kararın gerekçesini yazın">${esc(it.workflow_note||'')}</textarea></div></div><button class="btn btn-details" style="margin-top:10px" onclick="saveSupportWorkflowFromDrawer('${esc(it.id)}',${Number(it.workflow_revision||1)})">İş akışını güncelle</button></section><section class="danger-zone"><h3>Raporu arşivle</h3><p class="state-note">Arşivleme geri alınabilir; kayıt ve işlem geçmişi silinmez.</p><div class="workflow-field"><label for="support-archive-reason-${safeId}">Arşiv gerekçesi</label><textarea id="support-archive-reason-${safeId}" placeholder="Neden arşivlendiğini açıklayın"></textarea></div><label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:12px"><input id="support-archive-confirm-${safeId}" type="checkbox"> <span>Bu raporun açık vaka kuyruğundan kaldırılacağını onaylıyorum.</span></label><button class="btn btn-delete" style="margin-top:10px" onclick="archiveSupportReportFromDrawer('${esc(it.id)}',${Number(it.workflow_revision||1)},'${esc(priorityKey)}')">Gerekçeyle arşivle</button></section>`;
        const technicalHtml=`<section class="detail-card"><h3>Ortam özeti</h3><div class="detail-kv-grid"><div class="detail-kv"><span class="label">Platform</span><span class="value">${esc(it.platform||'Bilinmiyor')}</span></div><div class="detail-kv"><span class="label">Uygulama sürümü</span><span class="value">${esc(it.app_version||'Bilinmiyor')}</span></div><div class="detail-kv"><span class="label">Cihaz modeli</span><span class="value">${esc(it.device_model||'Bilinmiyor')}</span></div><div class="detail-kv"><span class="label">Ağ türü</span><span class="value">${esc(it.network_type||'Bilinmiyor')}</span></div><div class="detail-kv"><span class="label">Son hata kodu</span><span class="value">${esc(it.last_error_code||'Yok')}</span></div><div class="detail-kv"><span class="label">Maskeli rapor kimliği</span><span class="value">${esc(maskAdminIdentifier(it.id))}</span></div></div></section><details class="technical-evidence"><summary>Maskeli teknik kanıtı göster</summary><div class="detail-kv-grid" style="margin-top:10px"><div class="detail-kv"><span class="label">Maskeli e-posta</span><span class="value">${esc(it.contact_email||'Veri yok')}</span></div><div class="detail-kv"><span class="label">Maskeli IP</span><span class="value">${esc(it.ip||'Veri yok')}</span></div><div class="detail-kv"><span class="label">Maskeli User-Agent</span><span class="value">${esc(it.user_agent||'Veri yok')}</span></div><div class="detail-kv"><span class="label">Maskeli teslim kimliği</span><span class="value">${esc(it.brevo_message_id||'Veri yok')}</span></div><div class="detail-kv"><span class="label">Teslim hatası</span><span class="value">${esc(it.brevo_error||'Yok')}</span></div><div class="detail-kv"><span class="label">Sorun kümesi</span><span class="value">${esc(it.problem_fingerprint?`${String(it.problem_fingerprint).slice(0,12)}…`:'Tekil kayıt')}</span></div></div></details>`;
        openDetailDrawer({title:subject(it.subject),subtitle:`${WORKFLOW_LABELS[statusKey]||'Yeni'} · ${PRIORITY_LABELS[priorityKey]||'Normal'} · ${Number(group.report_count||1)} rapor`,avatar:'!',tabs:[{id:'overview',label:'Özet',html:overviewHtml},{id:'report',label:'Kullanıcı bildirimi',html:reportHtml},{id:'evidence',label:'Kanıt & geçmiş',html:evidenceHtml},{id:'workflow',label:'İş akışı',html:workflowHtml},{id:'technical',label:'Teknik',html:technicalHtml}]});
      }catch(e){openDetailDrawer({title:'Uygulama raporu',subtitle:'Vaka ayrıntısı okunamadı',avatar:'!',tabs:[{id:'error',label:'Durum',html:`<div class="admin-state"><div class="admin-state-icon">!</div><div><h3>Rapor ayrıntısı yüklenemedi</h3><p>${esc(e.message||e)}</p></div></div>`}]});}
    }

    async function patchSupportWorkflow(id,payload){
      const r=await fetch(`/admin/support-report/${id}/workflow`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const x=await r.json().catch(()=>({}));
      if(!r.ok||!x.success) throw new Error(x.error||'Workflow guncellenemedi');
      return x;
    }
    async function saveSupportWorkflowFromDrawer(id,revision){
      const safeId=String(id||'report').replace(/[^a-zA-Z0-9_-]/g,'');
      const status=document.getElementById(`support-status-${safeId}`)?.value||'new';
      const priority=document.getElementById(`support-priority-${safeId}`)?.value||'normal';
      const owner=(document.getElementById(`support-owner-${safeId}`)?.value||'').trim();
      const reason=(document.getElementById(`support-note-${safeId}`)?.value||'').trim();
      if(reason.length<3){alert('En az 3 karakterlik not ve gerekçe gerekli.');return;}
      try{
        await patchSupportWorkflow(id,{expectedRevision:revision,status,priority,owner,reason,note:reason});
        closeDetailDrawer();
        loadContent(); loadStats();
      }catch(e){alert(`İş akışı güncellenemedi: ${e.message}`);}
    }
    async function archiveSupportReportFromDrawer(id,revision,priority){
      const safeId=String(id||'report').replace(/[^a-zA-Z0-9_-]/g,'');
      const reason=(document.getElementById(`support-archive-reason-${safeId}`)?.value||'').trim();
      const confirmed=!!document.getElementById(`support-archive-confirm-${safeId}`)?.checked;
      if(reason.length<3){alert('En az 3 karakterlik arşiv gerekçesi gerekli.');return;}
      if(!confirmed){alert('Arşivleme etkisini onaylayın.');return;}
      try{
        await patchSupportWorkflow(id,{expectedRevision:revision,status:'archived',priority,reason,note:reason});
        closeDetailDrawer(); loadContent(); loadStats();
      }catch(e){alert(`Arşivleme hatası: ${e.message}`);}
    }

    async function sendNotice(){
      let payload;
      try{ payload=collectNotificationSchedulePayload(); }
      catch(error){ alert(error.message||error); return; }
      const {contentByLocale,target,durationSeconds}=payload;
      const durationMs=durationSeconds*1000;
      const out=document.getElementById('notification-result');
      if(out){out.classList.add('is-visible');out.innerHTML='<div class="admin-state" style="min-height:110px"><div class="admin-state-icon">•••</div><div><h3>Gönderim başlatıldı</h3><p>WebSocket ve push teslim sonuçları bekleniyor.</p></div></div>';}
      cancelImmediateNotice();
      try{
        const r=await fetch('/admin/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contentByLocale,target,durationMs})});
        const raw=await r.text(); let x={}; try{x=raw?JSON.parse(raw):{};}catch{throw new Error(`Sunucu JSON dönmedi (HTTP ${r.status}).`);}
        if(!r.ok||!x.success) throw new Error(x.error||'Bildirim gönderimi başarısız');
        const err=x.push?.errorSummary||{}; const errTxt=Object.keys(err).length?` | hata: ${Object.entries(err).map(([k,v])=>`${k}=${v}`).join(', ')}`:'';
        const tr=x.localeSummary?.tr||{}; const en=x.localeSummary?.en||{}; const fallback=x.localeSummary?.fallback||{};
        if(out) out.innerHTML=`<div class="insight-grid"><article class="insight-card"><h3>Kesin hedef</h3><p>${Number(x.audience?.recipientCount||0)} benzersiz kullanıcı.<span class="next">${Number(x.audience?.wsConnections||0)} WS · ${Number(x.audience?.pushDevices||0)} push cihazı</span></p></article><article class="insight-card"><h3>TR / EN teslimi</h3><p>TR: ${Number(tr.wsDelivered||0)} WS + ${Number(tr.pushSent||0)} push · EN: ${Number(en.wsDelivered||0)} WS + ${Number(en.pushSent||0)} push<span class="next">Fallback EN: ${Number(fallback.wsDelivered||0)+Number(fallback.pushDevices||0)}</span></p></article><article class="insight-card ${Number(x.push?.failureCount||0)>0?'is-warn':''}"><h3>Push sonucu</h3><p>${Number(x.push?.sentCount||0)} / ${Number(x.push?.tokenCount||0)} cihaz · ${Number(x.push?.failureCount||0)} hata${esc(errTxt)}<span class="next">Kesin sonuç gönderim yanıtıdır.</span></p></article></div>`;
        loadPushHealth(); loadPushDiagnostics();
      }catch(e){if(out) out.innerHTML=`<div class="admin-state" style="min-height:110px"><div class="admin-state-icon">!</div><div><h3>Gönderim tamamlanamadı</h3><p>${esc(e.message||e)}</p></div></div>`;}
    }

    async function apiPost(url,body){
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const raw=await r.text(); const x=(()=>{try{return raw?JSON.parse(raw):{};}catch{return{};}})();
      if(!r.ok) throw new Error(x.error||'Istek basarisiz');
      loadContent(); loadStats(); loadPerformanceSummaryCard();
    }
    async function postBulkAction(body){
      const r=await fetch('/admin/bulk-user-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const raw=await r.text();
      const x=(()=>{try{return raw?JSON.parse(raw):{};}catch{return{};}})();
      if(!r.ok) throw new Error(x.error||'Toplu islem basarisiz');
      return x;
    }
    async function actionBulkBan(days,type){
      const ids=getBulkSelectedUserIds();
      if(!ids.length){ alert('Toplu islem icin en az bir profil secin.'); return; }
      const mode=type==='shadow'?'golge ban':days===0?'kalici ban':'24 saat ban';
      if(!confirm(`Secili ${ids.length} kullaniciya ${mode} uygulansin mi?`)) return;
      try{
        setBulkBusy(true);
        await postBulkAction({
          action:'ban',
          userIds:ids,
          days:Number(days)||0,
          type:type==='shadow'?'shadow':'temp',
          reason:`Panel toplu islem (${currentTab})`
        });
        clearBulkSelectionState();
        await loadContent();
        await loadStats();
        await loadPerformanceSummaryCard();
      }catch(e){
        alert(`Toplu ban hatasi: ${e.message||e}`);
      }finally{
        setBulkBusy(false);
      }
    }
    async function actionBulkUnban(){
      const ids=getBulkSelectedUserIds();
      if(!ids.length){ alert('Toplu islem icin en az bir profil secin.'); return; }
      if(!confirm(`Secili ${ids.length} kullanicinin yasagi kaldirilsin mi?`)) return;
      try{
        setBulkBusy(true);
        await postBulkAction({action:'unban',userIds:ids});
        clearBulkSelectionState();
        await loadContent();
        await loadStats();
        await loadPerformanceSummaryCard();
      }catch(e){
        alert(`Toplu unban hatasi: ${e.message||e}`);
      }finally{
        setBulkBusy(false);
      }
    }
    async function actionUnblock(blockerId,blockedId){ const reason=(prompt('Engeli kaldırma gerekçesi:')||'').trim();if(reason.length<3)return;if(!confirm('Bu engel yönü kaldırılsın mı?')) return; await apiPost('/admin/unblock',{blockerId,blockedId,reason}); closeDetailDrawer(); }
    async function actionAddFriend(userId,username,inputId){
      const friendRef=(document.getElementById(inputId)?.value||'').trim();
      if(!friendRef){ alert('Kullanici adi veya UUID girin.'); return; }
      if(!confirm('Bu profile arkadas eklensin mi?')) return;
      await apiPost('/admin/add-friend',{userId,friendRef});
      await openProfileDetails(userId,username||'-');
    }
    async function actionRemoveFriend(userId,friendId){ const reason=(prompt('Arkadaşlığı kaldırma gerekçesi:')||'').trim();if(reason.length<3)return;if(!confirm('Bu arkadaşlık kaldırılsın mı?')) return; await apiPost('/admin/remove-friend',{userId,friendId,reason}); closeDetailDrawer(); }
    document.addEventListener('keydown',handleAdminKeydown);
    window.addEventListener('popstate',()=>switchTab(tabFromHash(),null,false));
    currentTab=tabFromHash();
    setActiveNav(currentTab);
    applySearchUI();
    applyTabChrome();
    if(currentTab==='online_users') startOnlineUsersAutoRefresh();
    loadContent();
  </script>
